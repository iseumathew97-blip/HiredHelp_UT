<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hired Help Manufacturing Support</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="icon" href="../icon-color.png" />
</head>
<body class="theme-mfg">
  <header class="site-header">
    <a href="../index.html" class="brand"><img src="../icon-color.png" alt="Hired Help" /></a>
    <nav>
      <a href="#contact">Contact</a>
    </nav>
    <a class="phone" href="tel:+13854121277">385-412-1277</a>
    <button class="menu" id="menuBtn" aria-label="Menu">☰</button>
  </header>
  <main>
    <section class="hero mfg-hero">
      <div class="hero-inner">
        <h1>Manufacturing support</h1>
        <p>On-site equipment training and equipment maintenance.</p>
        <a class="btn btn-gold" href="#contact">Request help</a>
      </div>
    </section>
    <section id="contact" style="padding:64px 0">
      <div class="wrap">
        <h2>Request support</h2>
        <form id="contactForm">
          <input type="text" name="website" class="honeypot" tabindex="-1" autocomplete="off" />
          <label>Name<input name="name" required /></label>
          <label>Phone<input name="phone" type="tel" required /></label>
          <label>Email<input name="email" type="email" /></label>
          <label>Details<textarea name="message" placeholder="Equipment, location, and what you need"></textarea></label>
          <button class="btn btn-dark" type="submit">Send</button>
          <p class="form-status" id="formStatus" hidden></p>
        </form>
      </div>
    </section>
  </main>
  <footer>
    <p>385-412-1277 · sales@hiredhelput.com</p>
  </footer>
  <script src="../script.js"></script>
</body>
</html>
